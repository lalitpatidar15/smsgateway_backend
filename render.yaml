services:
  - type: web
    name: smsgateway-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        sync: false
      - key: JWT_SECRET
        value: smsgateway-prod-jwt-secret-key-2026-change-me
      - key: ADMIN_DEFAULT_EMAIL
        value: admin@example.com
      - key: ADMIN_DEFAULT_PASSWORD
        value: Admin@12345
      - key: NODE_ENV
        value: production
      - key: APP_PORT
        value: "10000"
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: "*"
