services:
  - type: web
    name: smsgateway-backend
    runtime: node
    plan: free
    buildCommand: |
      apt-get update && apt-get install -y openssl libssl-dev && \
      npm install && \
      npx prisma generate && \
      npm run build
    startCommand: npx prisma migrate deploy && node dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        sync: false
      - key: JWT_SECRET
        value: smsgateway-prod-jwt-secret-key-2026-change-me
      - key: ADMIN_DEFAULT_EMAIL
        value: admin@example.com
      - key: ADMIN_DEFAULT_PASSWORD
        value: Admin@12345
      - key: NODE_ENV
        value: production
      - key: APP_PORT
        value: "10000"
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: "*"
